id: honours_awards_nomination
title: Honours and Awards Nomination
description: Organisation-led nomination for national honours and awards.
categories: {}
elements: "introduction:\n  '#type': webform_markup\n  '#markup': <div class=\"awards-form-intro\"><h2>Nominate\
  \ someone for an honour or\n    award</h2><p>The nominating organisation must complete this form. Prepare the\n\
  \    nominee’s background, nomination justification, signed or stamped endorsement,\n    and evidence of committee\
  \ scrutiny before you begin.</p><p>For assistance, contact\n    <a href=\"mailto:clerkcabinet@ob.gov.ki\">clerkcabinet@ob.gov.ki</a>.\
  \ Required fields\n    are marked with an asterisk.</p><p><a href=\"/service/awards\">Read the award criteria\n\
  \    and nomination guidance</a></p></div>\norganisation:\n  '#type': fieldset\n  '#title': 1. Nominating organisation\n\
  \  organisation_name:\n    '#type': textfield\n    '#title': Organisation name\n    '#required': true\n    '#maxlength':\
  \ 200\n  contact_name:\n    '#type': textfield\n    '#title': Authorised contact person\n    '#required': true\n\
  \    '#maxlength': 200\n  contact_phone:\n    '#type': tel\n    '#title': Contact phone number\n    '#required':\
  \ true\n  contact_email:\n    '#type': email\n    '#title': Contact email address\n    '#required': true\nnominee:\n\
  \  '#type': fieldset\n  '#title': 2. Nominee and proposed award\n  nominee_name:\n    '#type': textfield\n   \
  \ '#title': Nominee’s full name\n    '#required': true\n    '#maxlength': 200\n  date_of_birth:\n    '#type':\
  \ date\n    '#title': Date of birth\n    '#required': true\n    '#date_date_max': today\n  nationality:\n    '#type':\
  \ textfield\n    '#title': Nationality\n    '#required': true\n  award:\n    '#type': select\n    '#title': Proposed\
  \ award or medal\n    '#required': true\n    '#options':\n      kgo: Kiribati Grand Order (KGO)\n      kno: Kiribati\
  \ National Order (KNO)\n      kc: Kiribati Cross (KC)\n      kom: Kiribati Order of Merit (KOM)\n      msa: Meritorious\
  \ Services Award (Disciplined Services) (MSA)\n      klsgca: Kiribati Long Service and Good Conduct Award (KLSGCA)\n\
  \    '#empty_option': Select an award\nbackground:\n  '#type': fieldset\n  '#title': 3. Education and personal\
  \ background\n  education:\n    '#type': textarea\n    '#title': Educational background\n    '#required': true\n\
  \    '#rows': 5\n    '#description': List each education level, school, years attended and qualification\n   \
  \   attained, if any.\n  professional_history:\n    '#type': textarea\n    '#title': Professional and community\
  \ history\n    '#required': true\n    '#rows': 6\n  leadership:\n    '#type': textarea\n    '#title': Leadership\
  \ responsibilities\n    '#required': false\n    '#rows': 4\n    '#description': Include responsibilities held,\
  \ if applicable.\njustification_section:\n  '#type': fieldset\n  '#title': 4. Reasons for nomination\n  justification:\n\
  \    '#type': textarea\n    '#title': Justification for nomination\n    '#required': true\n    '#rows': 8\n  \
  \  '#description': Explain the nominee’s outstanding contribution or the event supporting\n      this nomination.\
  \ Relate the evidence to the proposed award criteria.\nwitnesses:\n  '#type': fieldset\n  '#title': 5. Kiribati\
  \ Cross witness evidence\n  witness_accounts:\n    '#type': textarea\n    '#title': Witness accounts and any explanation\
  \ for fewer than three witnesses\n    '#required': true\n    '#rows': 8\n    '#description': Provide at least\
  \ three witness accounts, identifying each witness\n      and their account. If three cannot be obtained, explain\
  \ why. Additional signed\n      accounts can be uploaded below.\n    '#states':\n      required:\n        :input[name=\"\
  award\"]:\n          value: kc\n  '#states':\n    visible:\n      :input[name=\"award\"]:\n        value: kc\n\
  documents:\n  '#type': fieldset\n  '#title': 6. Supporting documents\n  endorsement:\n    '#type': webform_document_file\n\
  \    '#title': Signed or stamped organisation endorsement\n    '#required': true\n    '#uri_scheme': private\n\
  \    '#file_extensions': pdf jpg jpeg png\n    '#max_filesize': '5'\n    '#description': Upload the organisation’s\
  \ official stamp endorsement, or the alternative\n      office-bearer signatures and Council/Church stamp described\
  \ in the guidance.\n  committee_evidence:\n    '#type': webform_document_file\n    '#title': Evidence of nomination\
  \ committee scrutiny\n    '#required': true\n    '#uri_scheme': private\n    '#file_extensions': pdf jpg jpeg\
  \ png\n    '#max_filesize': '5'\n  additional_documents:\n    '#type': webform_document_file\n    '#title': Additional\
  \ supporting evidence\n    '#required': false\n    '#multiple': true\n    '#uri_scheme': private\n    '#file_extensions':\
  \ pdf jpg jpeg png\n    '#max_filesize': '5'\n    '#description': Optional background information, supporting\
  \ letters or signed\n      witness accounts. Maximum 5 MB per file.\ndeclaration:\n  '#type': fieldset\n  '#title':\
  \ 7. Declaration\n  authorised:\n    '#type': checkbox\n    '#title': I am authorised to submit this nomination\
  \ on behalf of the nominating\n      organisation.\n    '#required': true\n  accurate:\n    '#type': checkbox\n\
  \    '#title': I confirm that the information and evidence supplied are accurate to\n      the best of my knowledge.\n\
  \    '#required': true\n  processing:\n    '#type': checkbox\n    '#title': I understand that this information\
  \ and the supporting documents will\n      be used to assess the nomination.\n    '#required': true\ncaptcha:\n\
  \  '#type': captcha\n  '#captcha_type': captcha/Math\nactions:\n  '#type': webform_actions\n  '#submit__label':\
  \ Submit nomination\n"
